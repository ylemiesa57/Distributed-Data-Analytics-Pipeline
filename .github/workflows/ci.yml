name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Byte-compile
        run: python -m py_compile reddit_producer.py
      - name: Run unit tests
        # No live Kafka broker or Reddit credentials needed: reddit_producer.py's
        # connection logic only runs inside main() (guarded by
        # `if __name__ == "__main__":`), so these tests exercise
        # connect_kafka_producer() and _on_send_error() directly with mocks.
        run: python -m unittest discover -s tests -v
